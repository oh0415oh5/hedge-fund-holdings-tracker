[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursort"
version = "0.1.0"
description = "Hedge Fund Holdings Tracker — SEC 13F institutional portfolio analysis with PDF reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sec", "edgar", "13f", "hedge-fund", "institutional-holdings", "finance"]
dependencies = [
    "requests>=2.31",
    "lxml>=4.9",
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "Jinja2>=3.1",
    "weasyprint>=60",
    "Pillow>=10",
]

[project.scripts]
cursort = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.templates" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
